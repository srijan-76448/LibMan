<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibMan | Central Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./imgs/icon.png">
    <link rel="stylesheet" href="index.css" />
  </head>
  <body
    class="bg-gray-950 text-gray-100 min-h-screen antialiased selection:bg-indigo-500/30 selection:text-indigo-200"
  >
    <nav
      class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-40"
    >
      <div
        class="flex items-center gap-8 w-full md:w-auto justify-between md:justify-start"
      >
        <a href="/" class="flex items-center gap-2.5 select-none group">
          <div class="relative flex items-center justify-center w-3 h-3">
            <span
              class="absolute w-2.5 h-2.5 rounded-full bg-indigo-500 opacity-75 animate-ping"
            ></span>
            <span class="relative w-2 h-2 rounded-full bg-indigo-500"></span>
          </div>
          <span
            class="text-xl font-black tracking-widest text-gray-100 uppercase transition-colors duration-200 group-hover:text-indigo-400"
          >
            Lib<span class="text-indigo-500">Man</span>
          </span>
        </a>
        <div class="flex gap-4 text-xs tracking-tight">
          <a
            href="/e-books/"
            class="text-gray-400 hover:text-gray-200 pb-1 px-1 transition"
            >E-Books</a
          >
          <a
            href="/about-us/"
            class="text-gray-400 hover:text-gray-200 pb-1 px-1 transition"
            >About Us</a
          >
          <a
            href="/admin/"
            class="text-gray-400 hover:text-gray-200 pb-1 px-1 transition"
            >Admin</a
          >
        </div>
      </div>
      <a
        href="/admin/"
        class="w-full md:w-auto text-center border border-indigo-500/30 hover:border-indigo-500 bg-indigo-500/10 text-indigo-400 text-xs px-4 py-2 rounded-lg transition-all duration-200"
      >
        sudo login --admin
      </a>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-12 pb-6">
      <h2
        class="text-3xl font-extrabold tracking-tight text-gray-100 sm:text-4xl uppercase"
      >
        Central Book Registry
      </h2>
      <p class="mt-2 text-xs text-gray-400 max-w-xl leading-relaxed">
        Real-time public discovery engine synced with core repository arrays.
        Query indexed vectors seamlessly.
      </p>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
      <div class="relative">
        <input
          type="text"
          id="catalog-search"
          oninput="handleCatalogSearch(this.value)"
          placeholder="Query index string (Title, Author, ISBN)..."
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-5 py-4 text-sm focus:outline-none focus:border-indigo-500 transition-colors placeholder-gray-600 tracking-wide shadow-2xl"
        />
      </div>

      <div
        id="catalog-grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      ></div>

      <div
        id="empty-state"
        class="hidden text-center py-20 border border-dashed border-gray-800 rounded-xl"
      >
        <p class="text-sm text-gray-500">
          Zero search records matched that query vector.
        </p>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
