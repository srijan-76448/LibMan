<!DOCTYPEdoctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibMan | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="icon" type="image/png" href="../imgs/icon.png" />
    <link rel="stylesheet" href="index.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap");
      * {
        font-family: "JetBrains Mono", monospace, ui-monospace !important;
      }
      input:-webkit-autofill {
        -webkit-text-fill-color: #f3f4f6;
        -webkit-box-shadow: 0 0 0px 1000px #030712 inset;
      }
    </style>
  </head>
  <body
    class="bg-gray-950 text-gray-100 min-h-screen antialiased selection:bg-indigo-500/30 selection:text-indigo-200"
  >
    <div
      id="auth-gateway"
      class="hidden fixed inset-0 bg-black/90 backdrop-blur flex items-center justify-center p-4 z-50"
    >
      <div
        class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-xl p-6 space-y-4 text-xs"
      >
        <div
          class="flex justify-between items-center border-b border-gray-800 pb-2"
        >
          <h3
            id="auth-title"
            class="text-sm font-bold uppercase tracking-wider text-gray-100"
          >
            Elevated Privileges Required
          </h3>
          <button
            onclick="toggleAuthGateway(false)"
            class="text-gray-500 hover:text-gray-400 font-mono"
          >
            [close]
          </button>
        </div>

        <div id="login-mode-interface" class="space-y-4">
          <form
            id="auth-form"
            onsubmit="handleLegacyLogin(event)"
            class="space-y-3"
          >
            <div>
              <label class="block text-gray-400 mb-1">SUDO Username</label>
              <input
                type="text"
                id="auth-user"
                required
                class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-gray-100"
              />
            </div>
            <div>
              <label class="block text-gray-400 mb-1">Access Token Key</label>
              <input
                type="password"
                id="auth-pass"
                required
                class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-indigo-400"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg font-bold transition-colors text-white"
            >
              Authorize Key
            </button>
          </form>
          <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-gray-800"></div>
            <span
              class="flex-shrink mx-4 text-gray-600 uppercase tracking-widest text-[9px]"
              >OR</span
            >
            <div class="flex-grow border-t border-gray-800"></div>
          </div>
          <div class="flex justify-center py-1">
            <div id="google-login-btn"></div>
          </div>
          <div class="text-center pt-1">
            <button
              onclick="toggleAuthMode(true)"
              class="text-indigo-400 hover:underline tracking-wide font-medium"
            >
              [Create New Admin Account]
            </button>
          </div>
        </div>

        <div id="signup-mode-interface" class="hidden space-y-3">
          <form
            id="signup-form"
            onsubmit="handleLegacySignUp(event)"
            class="space-y-3"
          >
            <div>
              <label class="block text-gray-400 mb-1">New Admin Username</label>
              <input
                type="text"
                id="signup-user"
                required
                class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-gray-100"
              />
            </div>
            <div>
              <label class="block text-gray-400 mb-1"
                >New Access Token Key</label
              >
              <input
                type="password"
                id="signup-pass"
                required
                class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-emerald-400"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg font-bold transition-colors text-white"
            >
              Register Credentials
            </button>
          </form>
          <div class="text-center pt-2">
            <button
              onclick="toggleAuthMode(false)"
              class="text-gray-400 hover:underline font-mono"
            >
              [Back to Login]
            </button>
          </div>
        </div>

        <div
          id="auth-error"
          class="hidden text-red-400 font-bold uppercase text-[10px] tracking-wide bg-red-950/30 border border-red-900/50 p-2 rounded"
        >
          AUTHENTICATION_FAILURE: Action Denied
        </div>
      </div>
    </div>

    <nav
      class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-40"
    >
      <div
        class="flex items-center gap-8 w-full md:w-auto justify-between md:justify-start"
      >
        <a href="/" class="flex items-center gap-2.5 select-none group">
          <div class="relative flex items-center justify-center w-3 h-3">
            <span
              class="absolute w-2.5 h-2.5 rounded-full bg-indigo-500 opacity-75 animate-ping"
            ></span>
            <span class="relative w-2 h-2 rounded-full bg-indigo-500"></span>
          </div>
          <span
            class="text-xl font-black tracking-widest text-gray-100 uppercase transition-colors duration-200 group-hover:text-indigo-400"
          >
            Lib<span class="text-indigo-500">Man</span>
          </span>
        </a>
        <div class="flex gap-4 text-xs tracking-tight">
          <a
            href="/e-books/"
            class="text-gray-400 hover:text-gray-200 pb-1 px-1 transition"
            >E-Books</a
          >
          <a
            href="/about-us/"
            class="text-gray-400 hover:text-gray-200 pb-1 px-1 transition"
            >About Us</a
          >
          <a
            href="/admin/"
            class="text-indigo-400 border-b-2 border-indigo-500 pb-1 px-1 font-bold"
            >Admin</a
          >
        </div>
      </div>

      <div class="flex gap-3 w-full md:w-auto items-center">
        <button
          id="add-asset-btn"
          onclick="toggleModal(true)"
          class="hidden bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-4 py-2 rounded-lg transition-colors"
        >
          Add Asset
        </button>
        <button
          onclick="fetchInventories()"
          class="flex-1 md:flex-none border border-gray-700 hover:bg-gray-800 text-xs px-4 py-2 rounded-lg transition-colors"
        >
          Sync Database
        </button>

        <button
          id="login-trigger-btn"
          onclick="toggleAuthGateway(true)"
          class="flex-1 md:flex-none bg-indigo-950 text-indigo-400 border border-indigo-900/50 text-xs font-bold px-4 py-2 rounded-lg hover:bg-indigo-900/40 transition-colors"
        >
          Admin Login
        </button>
        <button
          id="logout-trigger-btn"
          onclick="handleAdminLogout()"
          class="hidden border border-red-900/40 text-red-400 text-xs px-4 py-2 rounded-lg hover:bg-red-950/20 transition-colors"
        >
          Logout
        </button>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
      <div class="border-b border-gray-800 flex gap-6 text-sm">
        <button
          onclick="switchPartition('books')"
          id="tab-btn-books"
          class="text-indigo-400 border-b-2 border-indigo-500 pb-3 px-1 font-bold tracking-tight"
        >
          Books Section
        </button>
        <button
          onclick="switchPartition('ebooks')"
          id="tab-btn-ebooks"
          class="text-gray-400 hover:text-gray-200 pb-3 px-1 transition-colors tracking-tight"
        >
          E-Books Section
        </button>
      </div>

      <header class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-2xl">
          <p class="text-xs uppercase tracking-wider text-gray-500 font-bold">Total Catalog Assets</p>
          <p id="total-books" class="text-3xl font-black mt-1 text-indigo-400">0</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-2xl">
          <p class="text-xs uppercase tracking-wider text-gray-500 font-bold">Available Items</p>
          <p id="available-books" class="text-3xl font-black mt-1 text-emerald-400">0</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-2xl">
          <p class="text-xs uppercase tracking-wider text-gray-500 font-bold">Allocated / Out</p>
          <p id="issued-books" class="text-3xl font-black mt-1 text-amber-400">0</p>
        </div>
      </header>

      <div class="relative">
        <input
          type="text"
          id="search-bar"
          oninput="handleSearch(this.value)"
          placeholder="Filter localized dataset indices..."
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition-colors placeholder-gray-600 shadow-2xl"
        />
      </div>

      <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-2xl">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-gray-800 bg-gray-900/80 text-xs font-bold uppercase tracking-wider text-gray-400">
              <th class="p-4">Asset ID</th>
              <th class="p-4">Title</th>
              <th class="p-4">AuthorNode</th>
              <th id="column-header-extra" class="p-4">Dynamic Metric</th>
              <th class="p-4 text-right">Data Mutation State</th>
            </tr>
          </thead>
          <tbody id="inventory-table" class="divide-y divide-gray-800/50 text-xs">
              </tbody>
        </table>
      </div>
    </main>

    <div
      id="asset-modal"
      class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50"
    >
      <div
        class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-xl p-6 space-y-4 text-xs"
      >
        <h3 id="modal-form-title" class="text-sm font-bold uppercase tracking-wider text-gray-100">
          Ingest New Catalog Item
        </h3>
        <form id="asset-form" onsubmit="submitAsset(event)" class="space-y-4">
          <div>
            <label class="block text-gray-400 mb-1">Asset ID (ISBN/UUID)</label>
            <input
              type="text"
              id="form-id"
              required
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-indigo-400"
            />
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Title</label>
            <input
              type="text"
              id="form-title"
              required
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Author</label>
            <input
              type="text"
              id="form-author"
              required
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div id="form-extra-container" class="hidden">
            <label id="form-extra-label" class="block text-gray-400 mb-1">Download URL</label>
            <input
              type="text"
              id="form-extra"
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-indigo-300"
            />
          </div>
          <div class="flex justify-end gap-3 pt-2">
            <button
              type="button"
              onclick="toggleModal(false)"
              class="border border-gray-800 hover:bg-gray-800 px-4 py-2 rounded-lg transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold transition-colors"
            >
              Commit
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
